name: Build aggregate skill source

# Rebuilds the published aggregate from manifest.json and commits the result.
# WHY CI (measured, case E-001):
#   - raw.githubusercontent.com is ECONNRESET on the author's local machine
#   - api.github.com anonymous = 60 req/h (403 observed); GITHUB_TOKEN = 5000 req/h
#   - a full rebuild needs thousands of blob reads

on:
  schedule:
    - cron: "17 3 * * 1"      # weekly, Monday 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "manifest.json"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: aggregate-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # build.mjs defaults to writing into the repository root (skills/ + index.json
      # + SKILLS.md) because the panel scans the whole repo zip.
      - name: Build aggregate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGG_BUDGET_BYTES: "27262976"     # 26 MiB, safely under the 32 MiB panel cap
        run: node scripts/build.mjs

      - name: Verify panel constraints
        run: node scripts/verify.mjs

      - name: Read build summary
        id: summary
        run: |
          node -e "
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync('.build-summary.json','utf8'));
            const line='skills='+s.skills+' bytes='+s.bytes+' skipped='+s.skipped;
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'stats='+line+'\n');
            console.log(line);
            if (s.skills < 1) { console.error('refusing to publish an empty aggregate'); process.exit(1); }
          "

      - name: Commit generated tree
        run: |
          set -e
          git config user.name  "dsh-skill-aggregator[bot]"
          git config user.email "dsh-skill-aggregator@users.noreply.github.com"
          git add -A skills index.json SKILLS.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(build): ${{ steps.summary.outputs.stats }}"
            git push
          fi
